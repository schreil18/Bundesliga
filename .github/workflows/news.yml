name: News aktualisieren

on:
  schedule:
    - cron: "7,37 * * * *"     # alle 30 Minuten (leicht versetzt, zur vollen Stunde ist GitHub überlastet)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Feeds abrufen
        run: python scripts/fetch_news.py

      - name: news.json speichern
        run: |
          if git diff --quiet -- news.json; then
            echo "Keine neuen Meldungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "News aktualisiert"
          git pull --rebase --autostash origin main
          git push
